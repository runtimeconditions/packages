name: Publish Linux packages

on:
  repository_dispatch:
    types: [rc-cli-release-published, rc-profiler-typescript-release-published]
  workflow_dispatch:
    inputs:
      package:
        description: Package that the tag belongs to
        required: false
        default: rc-cli
        type: choice
        options: [rc-cli, rc-profiler-typescript]
      tag:
        description: Stable release tag of that package to validate; blank rebuilds from current releases
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: linux-packages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apt-utils createrepo-c rpm gnupg
      - name: Verify packages and build signed repositories
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          RELEASE_PACKAGE: ${{ inputs.package || (github.event.action == 'rc-profiler-typescript-release-published' && 'rc-profiler-typescript') || 'rc-cli' }}
          SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_PRIVATE_KEY }}
          SIGNING_FINGERPRINT: ${{ vars.PACKAGE_SIGNING_KEY_ID }}
          GNUPGHOME: ${{ runner.temp }}/package-signing
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing PACKAGE_SIGNING_PRIVATE_KEY secret" >&2; exit 1; }
          test -n "$SIGNING_FINGERPRINT" || { echo "Missing PACKAGE_SIGNING_KEY_ID variable" >&2; exit 1; }
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          python3 scripts/build_repository.py --package "$RELEASE_PACKAGE" --tag "$RELEASE_TAG" \
            --key "$SIGNING_FINGERPRINT" --output "$RUNNER_TEMP/site"
      - name: Upload repository site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy repository site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
